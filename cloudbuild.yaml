# Cloud Build 트리거 설정. GitHub main 브랜치 푸시 시 실행된다.
#
# 사전 준비 (GCP 콘솔/gcloud에서 1회):
# 1) Secret Manager에 시크릿 생성 — 기존 GEMINI_API_KEY는 대화 로그에 노출되었으므로
#    반드시 새로 발급받은 키로 등록할 것.
#      gcloud secrets create gemini-api-key --replication-policy=automatic
#      echo -n "<새로 발급받은 GEMINI_API_KEY>" | gcloud secrets versions add gemini-api-key --data-file=-
# 2) Cloud Build 서비스 계정에 시크릿 접근 권한 부여
#      gcloud secrets add-iam-policy-binding gemini-api-key \
#        --member="serviceAccount:<PROJECT_NUMBER>@cloudbuild.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
# 3) Cloud Build 트리거(GCP 콘솔)에서 "Cloud Build 구성 파일" 방식을 선택하고
#    이 파일(cloudbuild.yaml)을 가리키도록 설정한다. 이전 트리거가 자동 생성한
#    빌드/배포 스텝은 더 이상 쓰지 않는다.
#
# VITE_ADSENSE_CLIENT_ID / VITE_ADSENSE_SLOT_ID는 vite가 빌드 타임에 클라이언트
# 번들에 굽는 값이라 Docker build-arg로 전달한다(런타임 env로는 반영 안 됨).
# 둘 다 코드(GoogleAds.tsx)에 fallback이 있는 공개 값이라 비워둬도 동작한다.
#
# VITE_LEMON_SQUEEZY_CHECKOUT_URL과 APP_URL은 소스 전체를 검색해도 실제로 읽는
# 코드가 없어(server.ts는 요청 Host 헤더로 base URL을 동적 계산) 넘기지 않는다.

# Cloud Build 초고속 최적화 파이프라인 (목표: 1분대 완료)
# 1) E2_HIGHCPU_8 (8 vCPU + 고속 네트워크) 머신 타입 적용으로 CPU/네트워크 병목 해소
# 2) 무거운 builder-cache 다운/업로드 제거 및 배포 이미지 인라인 캐시로 단일 빌드 통합
# 3) 이미지 병렬 푸시(&) 적용
# 4) 프리캐시된 gcloud 빌더 사용으로 도커 이미지 다운로드 오버헤드 제거

steps:
  # 0) 이전 최신 배포 이미지 캐시 가져오기 (가볍고 빠름)
  - id: PullCache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull ${_IMAGE_LATEST} || true

  # 1) 단일 초고속 Build (8 vCPU 멀티코어로 vite+esbuild 고속 빌드 & 인라인 캐시 생성)
  - id: Build
    name: gcr.io/cloud-builders/docker
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - --cache-from=${_IMAGE_LATEST}
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --build-arg=VITE_ADSENSE_CLIENT_ID=${_ADSENSE_CLIENT_ID}
      - --build-arg=VITE_ADSENSE_SLOT_ID=${_ADSENSE_SLOT_ID}
      - -t=${_IMAGE}
      - -t=${_IMAGE_LATEST}
      - .

  # 2) Artifact Registry로 배포 이미지 및 최신 태그 병렬 동시 푸시
  - id: Push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_IMAGE} &
        docker push ${_IMAGE_LATEST} &
        wait

  # 3) Cloud Run 배포 (프리캐시된 공식 gcloud 빌더로 이미지 pull 시간 0초)
  - id: Deploy
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --quiet

images:
  - ${_IMAGE}
  - ${_IMAGE_LATEST}

substitutions:
  _REGION: asia-east1
  _SERVICE_NAME: service
  _IMAGE: asia-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/fate-analysis/service:${COMMIT_SHA}
  _IMAGE_LATEST: asia-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/fate-analysis/service:latest
  _ADSENSE_CLIENT_ID: ""
  _ADSENSE_SLOT_ID: ""

options:
  machineType: 'E2_HIGHCPU_8'
  env:
    - 'DOCKER_BUILDKIT=1'
  logging: CLOUD_LOGGING_ONLY
